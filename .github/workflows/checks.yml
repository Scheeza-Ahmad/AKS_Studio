name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Frontend install and checks
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --audit-level=high
      - name: Backend install and checks
        working-directory: backend
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
